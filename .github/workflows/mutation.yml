name: Mutation evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/src/**"
      - "backend/tests/**"
      - "backend/stryker.config.json"
      - "backend/vitest.config.ts"
      - "backend/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mutation.yml"
      - ".github/hooks/**"
      - "scripts/copilot/**"
permissions:
  contents: read
jobs:
  hook-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/copilot/pre-tool-use.test.cjs
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend exec stryker run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: backend/reports/mutation/
          if-no-files-found: warn
